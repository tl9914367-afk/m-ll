<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papierkorb Management - Mitarbeiter-Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; }
        .login-card { width: 100%; max-width: 400px; background: #ffffff; border-radius: 20px; box-shadow: 0 25px 60px rgba(0,0,0,0.6); overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        .login-header { background: #0f172a; color: #ffffff; padding: 35px 20px 25px 20px; text-align: center; border-bottom: 4px solid #2563eb; }
        .btn-primary { background-color: #2563eb; border-color: #2563eb; transition: all 0.2s; }
        .btn-primary:hover { background-color: #1d4ed8; border-color: #1d4ed8; transform: translateY(-1px); }
        #welcomeOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); z-index: 9999; display: none; align-items: center; justify-content: center; text-align: center; color: white; }
        .server-status { font-size: 0.75rem; display: inline-flex; align-items: center; gap: 5px; background: #f0fdf4; color: #166534; padding: 3px 10px; border-radius: 12px; border: 1px solid #bbf7d0; }
    </style>
</head>
<body>

<div id="welcomeOverlay">
    <div class="p-4">
        <div class="display-3 text-success mb-3"><i class="bi bi-check-circle-fill"></i></div>
        <h2 class="fw-bold mb-2" id="welcomeTitle">Herzlich willkommen!</h2>
        <p class="text-muted fs-5 mb-3" id="welcomeSubtitle">System wird geladen...</p>
        <div class="spinner-border text-primary" role="status"></div>
    </div>
</div>

<div class="login-card">
    <div class="login-header">
        <div class="display-6 text-warning mb-2"><i class="bi bi-trash3-fill"></i></div>
        <h4 class="fw-bold mb-0">Papierkorb Management</h4>
        <span class="small text-muted">Betriebs- und Leitsystem Remscheid</span>
    </div>

    <div class="p-4">
        <div class="alert alert-danger py-2 small d-none align-items-center mb-3 shadow-sm" id="loginAlert" role="alert">
            <i class="bi bi-exclamation-octagon-fill me-2"></i>
            <span id="loginAlertText">Benutzername oder Passwort falsch.</span>
        </div>

        <form id="loginForm" onsubmit="event.preventDefault(); executeLogin();">
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="txtUsername" placeholder="Benutzername" required autocomplete="username">
                <label for="txtUsername"><i class="bi bi-person me-1"></i> Benutzername</label>
            </div>

            <div class="position-relative mb-4">
                <div class="form-floating">
                    <input type="password" class="form-control" id="txtPassword" placeholder="Passwort" required autocomplete="current-password" style="padding-right: 45px;">
                    <label for="txtPassword"><i class="bi bi-lock me-1"></i> Passwort</label>
                </div>
                <button type="button" class="btn btn-link text-muted position-absolute end-0 top-50 translate-middle-y me-2 text-decoration-none" onclick="togglePass()">
                    <i class="bi bi-eye-slash" id="eyeIcon"></i>
                </button>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold py-2 shadow-sm mb-3">
                Anmelden
            </button>
        </form>

        <div class="d-flex justify-content-between align-items-center border-top pt-3">
            <div class="server-status"><i class="bi bi-circle-fill text-success" style="font-size: 8px;"></i> Server Online</div>
            <div class="small text-muted"><i class="bi bi-shield-lock-fill text-primary me-1"></i> Verschlüsselt</div>
        </div>
    </div>
</div>

<script>
    function togglePass() {
        const passInp = document.getElementById('txtPassword');
        const eye = document.getElementById('eyeIcon');
        if (passInp.type === 'password') {
            passInp.type = 'text';
            eye.className = 'bi bi-eye text-primary';
        } else {
            passInp.type = 'password';
            eye.className = 'bi bi-eye-slash text-muted';
        }
    }

    async function executeLogin() {
        const username = document.getElementById('txtUsername').value.trim();
        const password = document.getElementById('txtPassword').value.trim();
        const alertBox = document.getElementById('loginAlert');

        alertBox.classList.add('d-none');

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();

            if (data.success) {
                document.getElementById('welcomeTitle').innerText = `Herzlich willkommen, ${data.user.name}!`;
                document.getElementById('welcomeSubtitle').innerText = data.user.role === 'office' 
                    ? 'Disponenten-Leitstelle wird geöffnet...' 
                    : 'Fahrer-Navigation wird geladen...';

                document.getElementById('welcomeOverlay').style.display = 'flex';

                setTimeout(() => {
                    if (data.user.role === 'office') {
                        window.location.href = 'disponent.html';
                    } else {
                        window.location.href = 'fahrer.html';
                    }
                }, 1000);
            } else {
                alertBox.classList.remove('d-none');
                document.getElementById('txtPassword').value = '';
                document.getElementById('txtPassword').focus();
            }
        } catch (e) {
            alert('Verbindungsfehler zum Server.');
        }
    }
</script>
</body>
</html>
